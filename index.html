<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="to-do-container">
                
        <!-- Create header for to-do list -->
        <header class="page-header">
            <img src="assets/Logo.jpg" alt="My Logo" class="logo">

            <div class="header-content">
                <p class="header-eyebrow">YOUR OWN WORKSPACE</p>
                <h1>To Do List</h1>
                <p class="header-subtitle">
                    Put your feelings on top forever.
                </p>
            </div>
        </header>

        <!-- Create form for adding tasks -->
        <form class="task-form">
            <input type="text" id="task-input" placeholder="Enter your task" required>
            <button type="button" class="add-button">
                + 
            </button>
        </form>

        <!-- Create section for displaying tasks -->
        <section class="task-section">

            <h2>Your Tasks</h2>

            <ul class="task-list">
                <!-- Here goes the to-do list cards-->
            </ul>

            <!-- Create footer for to-do list -->
            <footer class="to-do-footer">
                <p>Created by Angela Cheng</p>
            </footer>

        </section>
    </main>
</body>
</html>
